  <!-- Wordmark: IPI -->
  <!-- Letter I -->
  <rect x="236" y="62" width="36" height="96" fill="#002F87" rx="1" />

  <!-- Letter P -->
  <path d="M 300,62 H 368 C 392,62 406,73 406,94 C 406,115 392,126 368,126 H 336 V 158 H 300 Z M 336,83 V 105 H 364 C 374,105 380,101 380,94 C 380,87 374,83 364,83 Z" fill="#002F87" />

  <!-- Letter I -->
