  <!-- Slogan: Your Wellness. Our Passion. -->
  <text x="245" y="218" text-anchor="middle" font-family="'Times New Roman', Georgia, 'Playfair Display', serif" font-size="28" font-style="italic" font-weight="700" fill="#002F87" letter-spacing="0.5">Your Wellness. Our Passion.</text>
</svg>
